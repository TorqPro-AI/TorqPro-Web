name: TorqPro-Web v2 browser QA
on:
  push:
    branches:
      - feature/website-v2-20261020
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/site.spec.mjs --reporter=line
      - name: Upload visual screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: torqpro-v2-screenshots
          path: test-results/*.png
          if-no-files-found: warn
          retention-days: 14
