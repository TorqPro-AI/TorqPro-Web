name: TorqPro-Web v2 browser QA
on:
  push:
    branches:
      - feature/website-v2-20261020
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/site.spec.mjs --reporter=line
